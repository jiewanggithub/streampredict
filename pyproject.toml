[project]
name = "streampredict"
version = "0.1.0"
description = "Real-time machine-learning serving and autoscaling demo platform"
readme = "README.md"
requires-python = ">=3.11,<3.12"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".git", ".mypy_cache", ".pytest_cache", ".ruff_cache", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["streampredict_api", "streampredict_consumer", "tests", "tools"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
strict = true
pretty = true
show_error_codes = true
exclude = ["^build/", "^dist/", "^node_modules/"]
mypy_path = ["services/api/src", "services/consumer/src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# aiokafka ships no type information.
module = ["aiokafka", "aiokafka.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = [".", "services/api/src", "services/consumer/src"]
markers = [
    "kafka: needs a running broker; set STREAMPREDICT_TEST_KAFKA=localhost:9092 (make test-kafka)",
]
testpaths = ["tests"]
