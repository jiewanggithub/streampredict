# Local stack: Redis, Kafka (KRaft, single broker), the model lifecycle (Postgres + SeaweedFS +
# MLflow + deployment controller), model serving (ONNX Runtime), the FastAPI gateway, consumer
# workers, and the dashboard.
# Usage from the repository root: make up / make down / make logs
name: streampredict

services:
  redis:
    image: redis:7.4.7-alpine
    # Cache-only Redis: bounded memory with LRU eviction and no persistence.
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru",
              "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL is used by containers; EXTERNAL lets host processes (make api-dev, tests) connect.
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xmx512m -Xms512m
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    # Persist topics and committed offsets across container restarts (`make down` keeps them;
    # `docker compose down -v` resets the broker).
    volumes:
      - kafka-data:/var/lib/kafka/data
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  # Creates topics once (idempotent). Partitions cap consumer parallelism: 12 allows scaling to 12
  # workers. Events are retained for a day so failures can be replayed; dead letters for a week.
  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        create() {
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists \
            --topic "$$1" --partitions "$$2" --replication-factor 1 --config retention.ms="$$3"
        }
        create prediction-events 12 86400000
        create prediction-results 6 86400000
        create prediction-events-dlq 3 604800000
    restart: "no"

  # --- model lifecycle (M6) ---------------------------------------------------------------------

  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow
      POSTGRES_DB: mlflow
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow -d mlflow"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible artifact storage (MinIO's community edition is archived).
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333",
              "-s3.config=/etc/seaweedfs/s3.json", "-master.volumeSizeLimitMB=64"]
    volumes:
      - seaweedfs-data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9333/cluster/status > /dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20

  mlflow:
    build: ./mlflow
    environment:
      # MLflow 3 starts ~8 GenAI job-runner processes (~220 MB each) by default; this stack uses
      # tracking and the registry only.
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"
      MLFLOW_S3_ENDPOINT_URL: http://seaweedfs:8333
      AWS_ACCESS_KEY_ID: streampredict
      AWS_SECRET_ACCESS_KEY: streampredict-dev-secret
      MLFLOW_ARTIFACT_BUCKET: mlflow-artifacts
    command:
      - sh
      - -c
      - >-
        python /opt/init_bucket.py &&
        mlflow server --host 0.0.0.0 --port 5000 --workers 2
        --backend-store-uri postgresql://mlflow:mlflow@postgres:5432/mlflow
        --artifacts-destination s3://mlflow-artifacts/
        --allowed-hosts "mlflow,mlflow:5000,localhost,localhost:5001,127.0.0.1:5001"
    # Host port 5001: macOS reserves 5000 for AirPlay. UI at http://localhost:5001
    ports:
      - "5001:5000"
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  # Registers the committed demo versions (v1 baseline, v2 improved, v3 skewed) once.
  registry-seed:
    build:
      context: ../..
      dockerfile: services/model-controller/Dockerfile
    command: ["python", "-m", "streampredict_controller.seed",
              "--repository", "/app/ml/artifacts/model_repository"]
    environment:
      CONTROLLER_MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on:
      mlflow:
        condition: service_healthy
    restart: "no"

  model-controller:
    build:
      context: ../..
      dockerfile: services/model-controller/Dockerfile
    environment:
      CONTROLLER_MLFLOW_TRACKING_URI: http://mlflow:5000
      CONTROLLER_SERVING_URL: http://model-serving:8000
      CONTROLLER_DEPLOYED_REPOSITORY: /models
      CONTROLLER_LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - deployed-models:/models
    depends_on:
      registry-seed:
        condition: service_completed_successfully
      model-serving:
        condition: service_started
    stop_grace_period: 15s

  model-serving:
    build: ../../services/model-serving
    environment:
      SERVING_LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Deployed versions are managed by model-controller through this shared volume.
      SERVING_MODEL_REPOSITORY: /models
    volumes:
      - deployed-models:/models
    # Exposed for local inspection (curl localhost:8001/v2/models/streampredict-demo).
    ports:
      - "8001:8000"
    stop_grace_period: 15s

  api:
    build: ../../services/api
    environment:
      APP_ENV: development
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ALLOW_ORIGINS: http://localhost:3000
      REDIS_URL: redis://redis:6379/0
      REDIS_CACHE_TTL_SECONDS: ${REDIS_CACHE_TTL_SECONDS:-300}
      INFERENCE_BACKEND: serving
      SERVING_URL: http://model-serving:8000
      MODEL_NAME: ${MODEL_NAME:-streampredict-demo}
      MODEL_VERSION: ${MODEL_VERSION:-latest}
      DEMO_MAX_RPS: ${DEMO_MAX_RPS:-100}
      DEMO_MAX_DURATION_SECONDS: ${DEMO_MAX_DURATION_SECONDS:-300}
      DEMO_CONTROL_TOKEN: ${DEMO_CONTROL_TOKEN:-}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DEPLOYMENT_PLATFORM: docker-compose
      CONTROLLER_URL: http://model-controller:8000
      PROMETHEUS_URL: http://prometheus:9090
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      model-controller:
        condition: service_healthy
    stop_grace_period: 15s

  consumer:
    build:
      context: ../../services
      dockerfile: consumer/Dockerfile
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      REDIS_URL: redis://redis:6379/0
      REDIS_CACHE_TTL_SECONDS: ${REDIS_CACHE_TTL_SECONDS:-300}
      INFERENCE_BACKEND: serving
      SERVING_URL: http://model-serving:8000
      MODEL_NAME: ${MODEL_NAME:-streampredict-demo}
      MODEL_VERSION: ${MODEL_VERSION:-latest}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    deploy:
      replicas: ${CONSUMER_REPLICAS:-2}
    depends_on:
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      model-controller:
        condition: service_healthy
    stop_grace_period: 15s

  prometheus:
    image: prom/prometheus:v3.15.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=2d",
              "--web.enable-lifecycle"]
    volumes:
      - ../prometheus/prometheus-compose.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus/rules:/etc/prometheus/rules:ro
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 20

  dashboard:
    build:
      context: ../../apps/dashboard
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  kafka-data:
  postgres-data:
  seaweedfs-data:
  deployed-models:
