# KEDA scales consumers on consumer-group lag: desired replicas = total lag / lagThreshold,
# capped by maxReplicaCount and the partition count. Scale-up may double every 15 s (2 -> 4 -> 8);
# scale-down waits 60 s, then halves at most every 30 s.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata: { name: consumer }
spec:
  scaleTargetRef: { name: consumer }
  minReplicaCount: 2
  maxReplicaCount: 8
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          policies: [{ type: Percent, value: 100, periodSeconds: 15 }]
        scaleDown:
          stabilizationWindowSeconds: 60
          policies: [{ type: Percent, value: 50, periodSeconds: 30 }]
  triggers:
    - type: kafka
      metadata:
        # KEDA's scaler runs in the keda namespace, so use the fully qualified Service name.
        bootstrapServers: kafka.streampredict.svc.cluster.local:29092
        consumerGroup: streampredict-consumers
        topic: prediction-events
        lagThreshold: "50"
        offsetResetPolicy: earliest
