# Single-node local cluster. NodePorts are mapped to the same host ports as Docker Compose, so the
# dashboard (built for http://localhost:8000) works unchanged. Stop Compose first: make down.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: streampredict
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    extraPortMappings:
      - { containerPort: 30000, hostPort: 3000, protocol: TCP }   # dashboard
      - { containerPort: 30080, hostPort: 8000, protocol: TCP }   # API gateway
      - { containerPort: 30501, hostPort: 5001, protocol: TCP }   # MLflow UI
