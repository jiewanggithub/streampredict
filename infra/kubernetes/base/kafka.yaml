# Single-broker KRaft Kafka. Partitions (12) cap consumer parallelism and therefore KEDA's
# maxReplicaCount.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  labels: { app.kubernetes.io/name: kafka }
spec:
  serviceName: kafka
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: kafka } }
  template:
    metadata: { labels: { app.kubernetes.io/name: kafka, app.kubernetes.io/part-of: streampredict } }
    spec:
      containers:
        - name: kafka
          image: apache/kafka:4.3.1
          env:
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER }
            - { name: KAFKA_LISTENERS, value: "INTERNAL://:29092,CONTROLLER://:9093" }
            # Fully qualified so clients in other namespaces (KEDA's scaler in `keda`) can follow it.
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "INTERNAL://kafka.streampredict.svc.cluster.local:29092" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT" }
            - { name: KAFKA_INTER_BROKER_LISTENER_NAME, value: INTERNAL }
            - { name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "false" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
            - { name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0" }
            - { name: KAFKA_HEAP_OPTS, value: "-Xmx384m -Xms384m" }
            - { name: KAFKA_LOG_DIRS, value: /var/lib/kafka/data }
          ports: [{ containerPort: 29092, name: internal }]
          resources:
            requests: { cpu: 200m, memory: 640Mi }
            limits: { memory: 1Gi }
          startupProbe: { tcpSocket: { port: 29092 }, periodSeconds: 5, failureThreshold: 36 }
          readinessProbe: { tcpSocket: { port: 29092 }, periodSeconds: 10 }
          livenessProbe: { tcpSocket: { port: 29092 }, periodSeconds: 20 }
          volumeMounts: [{ name: data, mountPath: /var/lib/kafka/data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 2Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: kafka }
spec:
  selector: { app.kubernetes.io/name: kafka }
  ports: [{ port: 29092, name: internal }]
---
# Idempotent topic creation; retried by the Job until the broker accepts connections.
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-init
spec:
  backoffLimit: 20
  template:
    metadata: { labels: { app.kubernetes.io/name: kafka-init } }
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-topics
          image: apache/kafka:4.3.1
          command:
            - /bin/sh
            - -c
            - |
              set -e
              create() {
                /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists \
                  --topic "$1" --partitions "$2" --replication-factor 1 --config retention.ms="$3"
              }
              create prediction-events 12 86400000
              create prediction-results 6 86400000
              create prediction-events-dlq 3 604800000
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { memory: 512Mi }
