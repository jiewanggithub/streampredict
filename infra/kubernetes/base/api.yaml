# The gateway reads workloads, autoscalers, pod metrics, and rescale events for the dashboard:
# read-only and limited to this namespace.
apiVersion: v1
kind: ServiceAccount
metadata: { name: api }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: api-observer }
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: api-observer }
subjects: [{ kind: ServiceAccount, name: api }]
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: api-observer }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: { app.kubernetes.io/name: api }
spec:
  replicas: 2
  progressDeadlineSeconds: 180
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector: { matchLabels: { app.kubernetes.io/name: api } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: api, app.kubernetes.io/part-of: streampredict }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "8000" }
    spec:
      serviceAccountName: api
      securityContext: { runAsNonRoot: true, runAsUser: 10001 }
      # uvicorn stops accepting, then drains in-flight requests within this window.
      terminationGracePeriodSeconds: 20
      containers:
        - name: api
          image: streampredict-api:latest
          imagePullPolicy: Never
          envFrom: [{ configMapRef: { name: streampredict-config } }]
          env:
            - name: KUBERNETES_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - name: DEMO_CONTROL_TOKEN
              valueFrom: { secretKeyRef: { name: streampredict-secrets, key: DEMO_CONTROL_TOKEN } }
          ports: [{ containerPort: 8000, name: http }]
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 384Mi }
          livenessProbe: { httpGet: { path: /health, port: http }, periodSeconds: 10 }
          # /ready fails only when inference is unavailable; Redis/Kafka loss degrades instead.
          readinessProbe: { httpGet: { path: /ready, port: http }, periodSeconds: 5 }
---
apiVersion: v1
kind: Service
metadata: { name: api }
spec:
  type: NodePort
  selector: { app.kubernetes.io/name: api }
  ports: [{ port: 8000, targetPort: http, nodePort: 30080 }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: api }
spec:
  minAvailable: 1
  selector: { matchLabels: { app.kubernetes.io/name: api } }
