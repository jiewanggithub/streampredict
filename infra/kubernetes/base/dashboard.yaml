apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  labels: { app.kubernetes.io/name: dashboard }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: dashboard } }
  template:
    metadata: { labels: { app.kubernetes.io/name: dashboard, app.kubernetes.io/part-of: streampredict } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1000 }
      containers:
        - name: dashboard
          image: streampredict-dashboard:latest
          imagePullPolicy: Never
          ports: [{ containerPort: 3000, name: http }]
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { memory: 256Mi }
          readinessProbe: { httpGet: { path: /, port: http }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /, port: http }, periodSeconds: 20 }
---
apiVersion: v1
kind: Service
metadata: { name: dashboard }
spec:
  type: NodePort
  selector: { app.kubernetes.io/name: dashboard }
  ports: [{ port: 3000, targetPort: http, nodePort: 30000 }]
