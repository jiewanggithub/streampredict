apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels: { app.kubernetes.io/name: redis }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: redis } }
  template:
    metadata: { labels: { app.kubernetes.io/name: redis, app.kubernetes.io/part-of: streampredict } }
    spec:
      containers:
        - name: redis
          image: redis:7.4.7-alpine
          # Cache only: bounded memory, LRU eviction, no persistence.
          args: ["redis-server", "--maxmemory", "96mb", "--maxmemory-policy", "allkeys-lru",
                 "--save", "", "--appendonly", "no"]
          ports: [{ containerPort: 6379 }]
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { memory: 128Mi }
          readinessProbe: { exec: { command: ["redis-cli", "ping"] }, periodSeconds: 5 }
          livenessProbe: { tcpSocket: { port: 6379 }, periodSeconds: 10 }
---
apiVersion: v1
kind: Service
metadata: { name: redis }
spec:
  selector: { app.kubernetes.io/name: redis }
  ports: [{ port: 6379 }]
