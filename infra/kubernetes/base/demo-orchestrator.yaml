# One load generator per cluster. Gateway replicas proxy their demo endpoints here, so there is a
# single session state; synthetic traffic goes to the gateway Service like user traffic.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-orchestrator
  labels: { app.kubernetes.io/name: demo-orchestrator }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app.kubernetes.io/name: demo-orchestrator } }
  template:
    metadata: { labels: { app.kubernetes.io/name: demo-orchestrator, app.kubernetes.io/part-of: streampredict } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001 }
      containers:
        - name: demo-orchestrator
          image: streampredict-api:latest
          imagePullPolicy: Never
          command: ["uvicorn", "--factory", "streampredict_api.demo_service:app_factory",
                    "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
          envFrom: [{ configMapRef: { name: streampredict-config } }]
          env:
            - { name: DEMO_TARGET_URL, value: http://api:8000 }
          ports: [{ containerPort: 8000, name: http }]
          resources:
            requests: { cpu: 100m, memory: 96Mi }
            limits: { cpu: "1", memory: 256Mi }
          livenessProbe: { httpGet: { path: /health, port: http }, periodSeconds: 10 }
          readinessProbe: { httpGet: { path: /health, port: http }, periodSeconds: 5 }
---
apiVersion: v1
kind: Service
metadata: { name: demo-orchestrator }
spec:
  selector: { app.kubernetes.io/name: demo-orchestrator }
  ports: [{ port: 8000, targetPort: http }]
