# Shared, non-secret configuration. Every value maps to an environment variable read by the
# services' pydantic settings (see .env.example).
apiVersion: v1
kind: ConfigMap
metadata:
  name: streampredict-config
data:
  APP_ENV: production
  LOG_LEVEL: INFO
  REDIS_URL: redis://redis:6379/0
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  INFERENCE_BACKEND: serving
  SERVING_URL: http://model-serving:8000
  MODEL_NAME: streampredict-demo
  MODEL_VERSION: latest
  CONTROLLER_URL: http://model-controller:8000
  DEMO_ORCHESTRATOR_URL: http://demo-orchestrator:8000
  PROMETHEUS_URL: http://prometheus:9090
  CORS_ALLOW_ORIGINS: http://localhost:3000
  DEPLOYMENT_PLATFORM: kubernetes
  DEMO_MAX_RPS: "100"
  DEMO_MAX_DURATION_SECONDS: "300"
---
# Development credentials only. Real deployments inject these from a secret manager; nothing here
# protects production data.
apiVersion: v1
kind: Secret
metadata:
  name: streampredict-secrets
type: Opaque
stringData:
  POSTGRES_PASSWORD: mlflow
  AWS_ACCESS_KEY_ID: streampredict
  AWS_SECRET_ACCESS_KEY: streampredict-dev-secret
  DEMO_CONTROL_TOKEN: ""
