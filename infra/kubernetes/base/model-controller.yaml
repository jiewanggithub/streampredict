apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-controller
  labels: { app.kubernetes.io/name: model-controller }
spec:
  # Single writer of the deployed-model volume and the release state machine.
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app.kubernetes.io/name: model-controller } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: model-controller, app.kubernetes.io/part-of: streampredict }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "8000" }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001 }
      containers:
        - name: model-controller
          image: streampredict-model-controller:latest
          imagePullPolicy: Never
          env:
            - { name: CONTROLLER_MLFLOW_TRACKING_URI, value: http://mlflow:5000 }
            - { name: CONTROLLER_SERVING_URL, value: http://model-serving:8000 }
            - { name: CONTROLLER_SERVING_PEERS, value: "model-serving-peers:8000" }
            - { name: CONTROLLER_DEPLOYED_REPOSITORY, value: /models }
          ports: [{ containerPort: 8000, name: http }]
          resources:
            requests: { cpu: 50m, memory: 160Mi }
            limits: { memory: 512Mi }
          livenessProbe: { httpGet: { path: /health, port: http }, periodSeconds: 10 }
          readinessProbe: { httpGet: { path: /ready, port: http }, periodSeconds: 5 }
          volumeMounts: [{ name: models, mountPath: /models }]
      volumes:
        - name: models
          persistentVolumeClaim: { claimName: deployed-models }
---
apiVersion: v1
kind: Service
metadata: { name: model-controller }
spec:
  selector: { app.kubernetes.io/name: model-controller }
  ports: [{ port: 8000, targetPort: http }]
