# Docker Compose scrape configuration. DNS service discovery returns every replica of a service
# (e.g. both consumers), so each is scraped individually.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
  - job_name: streampredict-api
    dns_sd_configs: [{ names: [api], type: A, port: 8000, refresh_interval: 10s }]
  - job_name: streampredict-consumer
    dns_sd_configs: [{ names: [consumer], type: A, port: 9102, refresh_interval: 10s }]
  - job_name: streampredict-model-serving
    dns_sd_configs: [{ names: [model-serving], type: A, port: 8000, refresh_interval: 10s }]
  - job_name: streampredict-model-controller
    dns_sd_configs: [{ names: [model-controller], type: A, port: 8000, refresh_interval: 10s }]
