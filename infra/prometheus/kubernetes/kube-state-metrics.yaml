apiVersion: v1
kind: ServiceAccount
metadata: { name: kube-state-metrics }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: streampredict-kube-state-metrics }
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: streampredict-kube-state-metrics }
subjects: [{ kind: ServiceAccount, name: kube-state-metrics, namespace: streampredict }]
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: streampredict-kube-state-metrics }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  labels: { app.kubernetes.io/name: kube-state-metrics }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: kube-state-metrics } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: kube-state-metrics, app.kubernetes.io/part-of: streampredict }
    spec:
      serviceAccountName: kube-state-metrics
      securityContext: { runAsNonRoot: true, runAsUser: 65534 }
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.20.0
          args:
            - --namespaces=streampredict
            - --resources=pods,deployments,statefulsets,horizontalpodautoscalers
          ports: [{ containerPort: 8080, name: http }]
          resources:
            requests: { cpu: 25m, memory: 48Mi }
            limits: { memory: 192Mi }
          readinessProbe: { httpGet: { path: /readyz, port: 8081 }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /livez, port: 8080 }, periodSeconds: 20 }
---
apiVersion: v1
kind: Service
metadata: { name: kube-state-metrics }
spec:
  selector: { app.kubernetes.io/name: kube-state-metrics }
  ports: [{ port: 8080, targetPort: http }]
