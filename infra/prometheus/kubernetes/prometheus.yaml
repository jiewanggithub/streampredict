apiVersion: v1
kind: ServiceAccount
metadata: { name: prometheus }
---
# Read-only discovery of pods in this namespace and node proxy access for cAdvisor metrics.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: streampredict-prometheus }
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/proxy, nodes/metrics]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: streampredict-prometheus }
subjects: [{ kind: ServiceAccount, name: prometheus, namespace: streampredict }]
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: streampredict-prometheus }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: prometheus-discovery }
rules:
  - apiGroups: [""]
    resources: [pods, services, endpoints]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: prometheus-discovery }
subjects: [{ kind: ServiceAccount, name: prometheus }]
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: prometheus-discovery }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels: { app.kubernetes.io/name: prometheus }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app.kubernetes.io/name: prometheus } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: prometheus, app.kubernetes.io/part-of: streampredict }
    spec:
      serviceAccountName: prometheus
      securityContext: { runAsNonRoot: true, runAsUser: 65534, fsGroup: 65534 }
      containers:
        - name: prometheus
          image: prom/prometheus:v3.15.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=2d
            - --web.enable-lifecycle
          ports: [{ containerPort: 9090, name: http }]
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 768Mi }
          readinessProbe: { httpGet: { path: /-/ready, port: http }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /-/healthy, port: http }, periodSeconds: 15 }
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus/prometheus.yml, subPath: prometheus.yml }
            - { name: rules, mountPath: /etc/prometheus/rules }
            - { name: data, mountPath: /prometheus }
      volumes:
        - name: config
          configMap: { name: prometheus-config }
        - name: rules
          configMap: { name: prometheus-rules }
        - name: data
          emptyDir: { sizeLimit: 2Gi }
---
apiVersion: v1
kind: Service
metadata: { name: prometheus }
spec:
  selector: { app.kubernetes.io/name: prometheus }
  ports: [{ port: 9090, targetPort: http }]
